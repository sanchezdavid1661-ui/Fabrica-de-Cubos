<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fábrica de Cajas</title>
  <link rel="stylesheet" href="css/controles.css">

  <!-- Biblioteca A-Frame -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- Componentes JavaScript de la fábrica -->
  <script src="js/componentes.js"></script>

  <!-- Controles de navegación -->
  <script src="js/controles.js" defer></script>
  
</head>

<body>
  <a-scene fog="type: linear; color: #C9D6DE; near: 35; far: 80">

    <!-- ====== ILUMINACIÓN ====== -->

    <a-entity
      id="sun-light"
      light="type: directional;
             color: #FFF0D0;
             intensity: 3;
             castShadow: true;
             shadowCameraLeft: -20;
             shadowCameraRight: 20;
             shadowCameraTop: 40;
             shadowCameraBottom: -20"
             shadowCameraVisible: true
      position="0 9 5">
    </a-entity>

    <a-entity
      id="fill-light"
      light="type: hemisphere;
             color: #FFF0D0;
             groundColor: #B9D9F2;
             intensity: 2.0"
      position="0 0 5">
    </a-entity>

    <!-- ====== TEXTURAS ====== -->

    <a-assets>
      <img id="pasto" src="assets/texturas/textura-pasto-1.png">
      <img id="tierra" src="assets/texturas/textura-tierra.png">
      <img id="caja-moneda" src="assets/texturas/textura-caja-moneda.png">
      <img id="logo-mario" src="assets/texturas/textura-logo-mario-bro.png">
      <img id="soporte" src="assets/texturas/soporte-mastil.png">
      <img id="logo" src="assets/texturas/textura-logo-mario-bros.png">
      <img id="skybox-anime" src="assets/imagen/skybox-anime-equirectangular.jpg">

      <!-- Modelos 3D propios exportados desde Blender -->
      <a-asset-item
        id="modelo-bomba"
        src="assets/modelos/bomba.glb">
      </a-asset-item>


      <!-- Panorámica para cielo y reflexiones -->
      <img id="panorama" src="assets/imagen/panorama.png">

      <!-- Efectos de sonido -->
      <audio
        id="sonido-caja-moneda"
        src="assets/audio/caja-moneda.wav"
        preload="auto">
      </audio>

      <!-- Sonido breve que se reproduce con cada toque de la palanca -->
      <audio
        id="sonido-palanca"
        src="assets/audio/palanca.wav"
        preload="auto">
      </audio>

      <!-- Sonido continuo mientras la fábrica está en funcionamiento -->
      <audio
        id="sonido-fabrica"
        src="assets/audio/fabrica.mp3"
        preload="auto">
      </audio>

    </a-assets>

    <!-- ====== PISO Y CIELO ====== -->

    <a-box
      id="floor"
      position="-3.515 -0.244 -3.429"
      rotation="-90 0 0"
      scale="12 16 0.613"
      width="14"
      height="10"
      material="src: #pasto; repeat: 10 10; roughness: 0.9; metalness: 0"
      shadow="cast: false; receive: true">
    </a-box>

    <a-box
      id="floor-2"
      position="-3.515 -13.32 -3.429"
      rotation="-90 0 0"
      scale="12 16 25.63"
      width="14"
      height="10"
      material="src: #tierra; repeat: 20 20; roughness: 0.9; metalness: 0"
      shadow="cast: false; receive: true">
    </a-box>

    <a-sky
      id="sky"
      src="#skybox-anime"
      rotation="0 -180 0"
      material="fog: false">
    </a-sky>

    <!-- ====== FÁBRICA ====== -->

    <a-entity id="factory-group" position="0 0 0">

      <!-- ====== MÁQUINA PRINCIPAL ====== -->

      <a-entity
        id="machine-group"
        position="-3.200 1.750 -5.557"
        shadow="cast: true; receive: true">

        <a-box
          id="machine"
          position="0 0 0"
          width="3.300"
          height="3.500"
          depth="2.700"
          material="color: #EEF1F5; roughness: 0.30; metalness: 0.15"
          shadow="cast: true; receive: true">
        </a-box>

        <a-box
          id="machine-top"
          position="0 1.800 -0.004"
          width="3.450"
          height="0.250"
          depth="2.850"
          material="color: #F7F8FA; roughness: 0.30; metalness: 0.15">
        </a-box>

        <a-box
          id="machine-front-trim"
          position="1.863 1.721 -0.008"
          rotation="0 89.496 0"
          scale="1.000 1.926 1.000"
          width="3.000"
          height="0.220"
          depth="0.350"
          material="color: #E7A04E; roughness: 0.30; metalness: 0.15">
        </a-box>

        <a-cylinder
          id="machine-top-ring"
          position="0.077 1.966 -0.064"
          radius="0.420"
          height="0.180"
          material="color: #D4DCE7; roughness: 0.30; metalness: 0.15">
        </a-cylinder>

        <!-- Luz superior con brillo intermitente -->
        <a-sphere
          id="machine-light"
          position="0.072 2.444 -0.064"
          radius="0.170"
          material="color: #ff0e30;
                    emissive: #ff0e30;
                    emissiveIntensity: 0.30;
                    roughness: 0.3;
                    metalness: 0.15"
          animation="property: material.emissiveIntensity;
                     from: 0.15;
                     to: 1.1;
                     dur: 750;
                     dir: alternate;
                     loop: true;
                     easing: easeInOutSine">
        </a-sphere>

        <!-- Luz puntual de la máquina -->
        <a-entity
          id="machine-point-light"
          position="0.072 2.444 -0.064"
          light="type: point;
                 color: #FF6A2A;
                 intensity: 0.1;
                 distance: 4"
          animation="property: light.intensity;
                     from: 0.1;
                     to: 1.5;
                     dur: 750;
                     dir: alternate;
                     loop: true;
                     easing: easeInOutSine">
        </a-entity>

        <a-box
          id="cube-inside"
          position="0.649 -0.700 1.375"
          width="0.790"
          height="0.790"
          depth="0.650"
          material="color: #E76F43; roughness: 0.30; metalness: 0.15">
        </a-box>

        <a-box
          id="hole-bottom-2"
          position="1.671 -0.242 -0.016"
          scale="1 1 1.16"
          width="1.450"
          height="0.100"
          depth="1.450"
          material="color: #101A28; roughness: 0.30; metalness: 0.15"
          rotation="0 0 -89.95437383553924">
        </a-box>

        <!-- ====== PALANCA ====== -->

        <a-entity
          id="lever-pivot"
          position="0.644 -0.691 1.764"
          rotation="0 0 0"
          toggle-cinta
          animation__adelante="property: rotation;
                              from: 0 0 0;
                              to: 0 0 -25;
                              dur: 280;
                              easing: easeOutQuad;
                              startEvents: click"
          animation__centro="property: rotation;
                             to: 0 0 0;
                             dur: 300;
                             delay: 500;
                             easing: easeInOutQuad;
                             startEvents: animationcomplete__adelante"
          shadow="cast: true; receive: true">

          <a-cylinder
            id="side-disc-lower"
            class="clic"
            position="0 0 0"
            rotation="0 89.267 90.012"
            scale="1.000 2.726 1.000"
            radius="0.300"
            height="0.180"
            material="color: #D98B3C; roughness: 0.30; metalness: 0.15">
          </a-cylinder>

          <a-cylinder
            id="side-arm"
            class="clic"
            position="0.232 0.413 0.080"
            rotation="0 0 -30"
            scale="0.849 0.849 0.849"
            radius="0.100"
            height="0.900"
            material="color: #D6DEE8; roughness: 0.30; metalness: 0.15">
          </a-cylinder>

          <a-cylinder
            id="side-arm-3"
            class="clic"
            position="0.470 0.825 0.081"
            rotation="0 0 -30"
            scale="1.189 0.408 1.189"
            radius="0.100"
            height="0.900"
            material="color: #E76F43; roughness: 0.30; metalness: 0.15">
          </a-cylinder>

          <!-- Indicador luminoso interactivo de la palanca -->
          <a-entity
            id="lever-indicador"
            position="0.38 1.305 0.12"
            animation__pulso="
              property: scale;
              from: 1 1 1;
              to: 1.12 1.12 1.12;
              dur: 650;
              dir: alternate;
              loop: true;
              easing: easeInOutSine">

            <!-- Halo dorado -->
            <a-torus
              class="clic"
              geometry="
                primitive: torus;
                radius: 0.16;
                radiusTubular: 0.025;
                segmentsRadial: 8;
                segmentsTubular: 24"
              material="
                color: #FFD34E;
                emissive: #FFD34E;
                emissiveIntensity: 1.5;
                roughness: 0.3;
                metalness: 0">
            </a-torus>

            <!-- Núcleo luminoso -->
            <a-sphere
              class="clic"
              radius="0.045"
              material="
                color: #FFF3B0;
                emissive: #FFD34E;
                emissiveIntensity: 1.8"
              animation__brillo="
                property: material.emissiveIntensity;
                from: 0.7;
                to: 2.2;
                dur: 700;
                dir: alternate;
                loop: true;
                easing: easeInOutSine">
            </a-sphere>

          </a-entity>
            
        </a-entity>

        <!-- Elementos laterales de la máquina -->

        <a-cylinder
          id="side-disc-upper"

          rotation="0 89.611 90.012"
          scale="1.689 1.711 1.689"

          radius="0.100"

        </a-cylinder>

      </a-entity>

        </a-box>

        <!-- Bordes laterales -->
        <a-box

          scale="-0.8 -0.8 -0.8"
          geometry="primitive: torus; radius: 0.550; radiusTubular: 0.100; segmentsRadial: 36; segmentsTubular: 32; arc: 90"
          material="color: #d1d1d1; roughness: 0.600; metalness: 0.900">
        </a-torus>

        <a-cylinder
          id="base-support-1"

          material="color: #d1d1d1; roughness: 0.600; metalness: 0.900">

        <a-cylinder

        <a-cylinder

          height="1.000"
          radius="0.500"
          material="color: #E76F43; roughness: 0.30; metalness: 0.15">
        </a-cylinder>

      </a-entity>

      <!-- ====== PLATAFORMA DE ALMACENAMIENTO DEFECTUOSO ====== -->

        id="platform-group"
        position="-1.803 0.100 -1.556"
        shadow="cast: true; receive: true">

        <a-box

          segments-height="4"

        <a-box
          id="well"
          position="0 0 0"
          scale="1.000 1.000 1.420"
          width="1.450"
          height="0.100"
          depth="1.450"
          material="color: #101A28; roughness: 0.30; metalness: 0.15">
        </a-box>

      </a-entity>

      <!-- ====== ELEMENTOS DECORATIVOS ====== -->

      <!-- Modelo 3D creado por mi hecho con Blender: bomba de Mario Bros -->
